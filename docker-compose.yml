services:
  sendportal:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: sendportal:latest
    container_name: sendportal_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - sendportal-storage:/var/www/html/storage
    depends_on:
      sendportal_db:
        condition: service_healthy
      sendportal_redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$s=@fsockopen(\"127.0.0.1\",9000); exit($$s?0:1);'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  sendportal_nginx:
    image: sendportal:latest
    container_name: sendportal_nginx
    restart: unless-stopped
    ports:
      - "9002:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/http.d/default.conf:ro
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      sendportal:
        condition: service_healthy

  sendportal_redis:
    image: redis:7.2-alpine
    container_name: sendportal_redis
    restart: unless-stopped
    volumes:
      - sendportal-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  sendportal_db:
    image: mysql:8.0
    container_name: sendportal_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - sendportal-db-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  sendportal_deploy:
    image: sendportal:latest
    container_name: sendportal_deploy
    env_file:
      - .env
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/sendportal-deploy.sh"]
    volumes:
      - sendportal-storage:/var/www/html/storage
    depends_on:
      sendportal:
        condition: service_healthy
      sendportal_db:
        condition: service_healthy
      sendportal_redis:
        condition: service_healthy

volumes:
  sendportal-db-data:
  sendportal-redis-data:
  sendportal-storage:
